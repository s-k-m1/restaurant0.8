{% extends "auth_base.html" %}
{% load static %}

{% block title %}Edit Profile{% endblock title %}

{% block content %}

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="form-container p-4">

                <a href="{% url 'profile' %}" class="text-white mb-3 d-inline-block">
                    <i class="fa-solid fa-arrow-left fa-xl crossHo"></i>
                </a>

                <div class="text-center mb-4">
                    <h2 class="title mb-0">Edit Profile</h2>
                    <p class="text-white-50">Update your personal information</p>
                </div>

                <hr class="text-secondary">

                <form method="POST" enctype="multipart/form-data" class="text-white">
                    {% csrf_token %}

                    <div class="text-center mb-4">
                        {% if profile.profile_pic %}
                            <img src="{{ profile.profile_pic.url }}"
                                 class="rounded-circle mb-3"
                                 width="110" height="110"
                                 style="object-fit: cover;">
                        {% else %}
                            <i class="fa-solid fa-circle-user fa-5x text-secondary mb-3"></i>
                        {% endif %}

                        <div>
                            <label class="form-label text-white-50 small">Change Profile Picture</label>
                            <input type="file" name="profile_pic" class="form-control">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-white-50 small">Full Name</label>
                        <input type="text" name="full_name"
                               value="{{ profile.user.full_name }}"
                               class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-white-50 small">Email</label>
                        <input type="email"
                               value="{{ profile.user.email }}"
                               class="form-control" disabled>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-white-50 small">Phone</label>
                        <input type="text"
                               value="{{ profile.user.phone_number }}"
                               class="form-control" >
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-white-50 small">Gender</label>
                        <select name="gender" class="form-control custom-select-fix">
                            <option value="" class="bg-dark text-white">Select Gender</option>
                            <option value="Male" class="bg-dark text-white" {% if profile.gender == "Male" %}selected{% endif %}>Male</option>
                            <option value="Female" class="bg-dark text-white" {% if profile.gender == "Female" %}selected{% endif %}>Female</option>
                            <option value="Other" class="bg-dark text-white" {% if profile.gender == "Other" %}selected{% endif %}>Other</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-white-50 small">Date of Birth</label>
                        <input type="date"
                               name="date_of_birth"
                               value="{{ profile.date_of_birth|date:'Y-m-d' }}"
                               class="form-control">
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-warning">
                            <i class="fa-solid fa-floppy-disk me-2"></i>Save Changes
                        </button>

                        <a href="{% url 'profile' %}" class="btn btn-outline-secondary">
                            Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
.form-container {
    background-color: #1a1d21; /* Matching your screenshot background */
    border-radius: 15px;
}

.form-container input,
.form-container select {
    background-color: rgba(255,255,255,0.1) !important;
    border: 1px solid rgba(255,255,255,0.2) !important;
    color: white !important;
    border-radius: 8px;
}

/* THE FIX FOR GENDER DROPDOWN BACKGROUND */
.form-container select option {
    background-color: #212529 !important; /* Solid dark color for the list */
    color: white !important;
}

.form-container input:focus,
.form-container select:focus {
    border-color: #ffc107 !important;
    box-shadow: 0 0 5px rgba(255, 193, 7, 0.5);
    outline: none;
}

.title {
    color: #ffc107;
    font-weight: bold;
}

/* Ensures the date picker icon is visible in dark mode */
::-webkit-calendar-picker-indicator {
    filter: invert(1);
}
</style>

{% endblock content %}
