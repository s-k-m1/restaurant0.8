{% extends "auth_base.html" %}
{% load static %}

{% block title %}
change-password
{% endblock title %}

{% block content %}
<div class="container mt-3">
    <div class="row justify-content-center">
        <div class="col-4">
            <div class="form-container">
                <!-- cross icon -->
                <a href="{% url 'index_page' %}" class="text-white">
                    <i class="fa-solid fa-x fa-xl crossHo"></i>
                </a>
                <p class="title">Change Password</p>

                <form class="form" method="POST" action="{% url 'change_password' %}">
                    {% csrf_token %}

                    {% for fm in form %}
                    <div class="input-group">
                        <!-- {{fm.label}} -->
                        <label for="{{fm.id_for_label}}">{{fm.label}}</label>
                        {{fm}}

                        {{fm.errors|striptags}}
                    </div>
                    {% endfor %}

                    <button class="sign mt-3">Change Password</button>
                </form>

            </div>

        </div>
    </div>
</div>

{% endblock content %}
